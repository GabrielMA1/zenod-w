name: Deploy ZENO DETAIL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The site is served from the custom domain root (see CNAME), so every asset,
# canonical URL, sitemap entry and schema URL must be built for that origin.
env:
  SITE_BASE_PATH: /
  SITE_BASE_URL: https://zenodetail.com/

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publication_mode: ${{ steps.source.outputs.mode }}
      expected_revision: ${{ steps.source.outputs.revision }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Check Pages publication source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          configuration=$(gh api "repos/${GITHUB_REPOSITORY}/pages")
          mode=$(jq -r '.build_type' <<<"$configuration")
          revision="$GITHUB_SHA"
          if [ "$mode" = "legacy" ]; then
            branch=$(jq -r '.source.branch' <<<"$configuration")
            pages_source_path=$(jq -r '.source.path' <<<"$configuration")
            if [ "$branch" != "$GITHUB_REF_NAME" ] || [ "$pages_source_path" != "/" ]; then
              echo "::error::This branch release supports the current branch at repository root; Pages is configured for $branch:$pages_source_path."
              exit 1
            fi
            revision=$(node --input-type=module -e 'import {execFileSync} from "node:child_process"; import {validateBranchRelease} from "./scripts/branch-release.mjs"; console.log(validateBranchRelease(process.cwd(),execFileSync("git",["rev-parse","HEAD^"],{encoding:"utf8"}).trim()))')
          elif [ "$mode" != "workflow" ]; then
            echo "::error::Unknown Pages publication mode: $mode"
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          SITE_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: npm run build

      - name: Audit generated source
        env:
          SITE_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: npm run audit

      - name: Audit deployable artifact
        run: npm run audit:dist

      - name: Test localization and bag behavior
        run: npm test

      - name: Upload Pages artifact
        if: steps.source.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: needs.build.outputs.publication_mode == 'workflow'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    if: always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    needs: [build, deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Smoke-test the live site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_REVISION: ${{ needs.build.outputs.expected_revision }}
        run: |
          set -u
          base="${SITE_URL:-$SITE_BASE_URL}"
          base="${base%/}"
          echo "Verifying $base (expected source revision ${EXPECTED_REVISION})"

          # Pages can take a few minutes to propagate; retry until the new
          # build is served or give up after ~10 minutes.
          for attempt in $(seq 1 20); do
            home=$(curl -fsSL --max-time 20 "$base/?v=${GITHUB_SHA}" || true)
            if grep -Fq "name=\"build-revision\" content=\"${EXPECTED_REVISION}\"" <<<"$home" && grep -q '<link rel="canonical" href="https://zenodetail.com/"' <<<"$home"; then
              break
            fi
            echo "Attempt $attempt: new build not served yet; waiting 30s"
            home=""
            sleep 30
          done
          [ -n "$home" ] || { echo "::error::Live home page never served the current build."; exit 1; }

          css=$(grep -o 'href="/assets/app-[^"]*\.css"' <<<"$home" | head -1 | cut -d'"' -f2)
          js=$(grep -o 'src="/assets/app-[^"]*\.js"' <<<"$home" | head -1 | cut -d'"' -f2)
          [ -n "$css" ] && [ -n "$js" ] || { echo "::error::Home page is missing its bundled CSS or JS."; exit 1; }

          failed=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base$1")
            echo "$code $1"
            [ "$code" = "200" ] || failed=1
          }
          for path in "$css" "$js" /robots.txt /sitemap.xml /site.webmanifest \
                      /assets/images/brand/zeno-logo-web-white.svg /assets/images/brand/favicon.svg; do
            check "$path"
          done
          for language in en ro de es it pt fr; do
            prefix=""
            [ "$language" = "en" ] || prefix="/$language"
            for route in / /shop/ /products/drying-towel/ /about/ /faq/ /shipping-delivery/ /journal/ \
                         /journal/how-to-dry-your-car/ /journal/microfiber-towel-care/ /journal/choosing-a-drying-towel/; do
              check "$prefix$route"
            done
            translated=$(curl -fsSL --max-time 20 "$base$prefix/products/drying-towel/?v=${GITHUB_SHA}")
            grep -Fq "<html lang=\"$language\">" <<<"$translated" || { echo "::error::$language product has the wrong language."; failed=1; }
            grep -Fq 'hreflang="en" href="https://zenodetail.com/products/drying-towel/"' <<<"$translated" || { echo "::error::$language product is missing its English alternate."; failed=1; }
          done

          fonts=$(curl -fsSL --max-time 20 "$base$css" | grep -o '/assets/archivo-[^)]*\.woff2' | sort -u)
          for font in $fonts; do check "$font"; done
          [ -n "$fonts" ] || { echo "::error::Stylesheet references no Archivo font."; failed=1; }

          product=$(curl -fsSL --max-time 20 "$base/products/drying-towel/?v=${GITHUB_SHA}")
          grep -q 'data-add-to-cart="zeno-drying-towel"' <<<"$product" || { echo "::error::Product page has no add-to-cart control."; failed=1; }

          romanian=$(curl -fsSL --max-time 20 "$base/ro/products/drying-towel/?v=${GITHUB_SHA}")
          grep -q '<html lang="ro">' <<<"$romanian" || { echo "::error::Romanian product page has the wrong language."; failed=1; }
          grep -q 'hreflang="en" href="https://zenodetail.com/products/drying-towel/"' <<<"$romanian" || { echo "::error::Romanian product page has no English alternate."; failed=1; }

          missing=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/this-route-does-not-exist/")
          echo "$missing /this-route-does-not-exist/ (expect 404)"
          [ "$missing" = "404" ] || failed=1

          [ "$failed" = "0" ] || { echo "::error::Live site verification failed."; exit 1; }
          echo "Live site verified."

